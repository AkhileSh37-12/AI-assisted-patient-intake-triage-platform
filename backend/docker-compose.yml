version: "3.9"

services:

  postgres:

    image: pgvector/pgvector:pg16

    container_name: ai_triage_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_triage_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:

    build: .

    container_name: ai_triage_backend

    depends_on:
      - postgres

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


volumes:
  postgres_data: